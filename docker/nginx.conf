server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  autoindex off;

  # Keep request bodies small for this static site.
  # The enquiry endpoint is handled by enquiry-proxy, not this Nginx container.
  client_max_body_size 1m;

  # Basic health endpoint for Docker healthcheck / local verification.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Block hidden files such as .env, .git, .htaccess if they ever accidentally enter the image.
  location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Astro fingerprinted assets.
  location /_astro/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Common static assets.
  location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2?|txt|xml|json)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=604800";
  }

  # Static Astro pages.
  #
  # Important:
  # Serve /contact from /contact/index.html directly.
  # This avoids Nginx issuing a trailing-slash 301 for directory-style Astro pages.
  location / {
    try_files $uri/index.html $uri.html $uri =404;
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
}